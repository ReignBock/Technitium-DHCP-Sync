name: CI

# Pushes to main run these checks through the release workflow.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_PYTHON_PREFERENCE: managed

jobs:
  version:
    name: Version
    # Every merge into main releases project.version, so each pull request must raise it.
    # On main the version is already tagged by its release, so the check would fail there.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check the project version is higher than the latest release
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          latest=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | sort -V | tail -n 1)
          highest=$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)
          if [ "$version" = "$latest" ] || [ "$highest" != "$version" ]; then
            echo "::error::project.version $version must be higher than the latest tag v$latest; raise it in pyproject.toml and uv.lock"
            exit 1
          fi
          echo "v$version will be released on merge (latest is v${latest:-none})"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run mypy

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run pytest

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: docker compose -f tests/integration/compose.yml pull --quiet
      # Build the shipped image and run every sync in it, so the tests cover the artifact.
      - run: docker build -t technitium-dhcp-sync:ci .
      - run: uv run pytest -m integration --no-cov
        env:
          SYNC_IMAGE: technitium-dhcp-sync:ci
      - if: failure()
        run: docker compose -f tests/integration/compose.yml logs --no-color
