name: Release

# Every merge into main releases project.version from pyproject.toml. CI's Version job makes each
# pull request raise it, except one that changes only tests, which releases nothing. Run this
# workflow by hand on main to retry a failed release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases run one at a time, in merge order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  version:
    name: Resolve the version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2

      - name: Resolve the version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            # CI's Version job lets a change to tests alone through without a new version.
            if ! git diff --name-only HEAD^ HEAD | grep -qv '^tests/'; then
              echo "Only tests change, so v$version stays the latest release"
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::v$version is already released; a merge into main must raise project.version"
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Publish image and release
    needs: [ci, version]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.version.outputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Tagged only after the image is pushed, so a failed release leaves no tag behind. A tag
      # pushed with GITHUB_TOKEN starts no other workflow run.
      - name: Tag the release commit
        env:
          TAG: v${{ needs.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.version.outputs.version }}" --verify-tag --generate-notes
