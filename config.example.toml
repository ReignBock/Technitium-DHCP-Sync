# technitium-dhcp-sync settings. Secrets never go in this file: each *_env key names the
# environment variable that holds the value.

[sync]
interval_seconds = 60              # time between sync cycles
offer_delay_increment_seconds = 2  # added to the primary's offer delay on the secondary
secondary_lease_time_minutes = 5   # lease time of every secondary scope
log_level = "INFO"                 # DEBUG, INFO, WARNING, or ERROR

[primary]
url = "https://dns1.example.com:53443"
token_env = "TECHNITIUM_PRIMARY_TOKEN"
verify_tls = true
timeout_seconds = 10

[secondary]
url = "http://127.0.0.1:5380"
token_env = "TECHNITIUM_SECONDARY_TOKEN"
