[project]
name = "technitium-dhcp-sync"
version = "0.1.0"
description = "Mirror Technitium DHCP scopes and leases from a primary server to a failover secondary."
readme = "README.md"
license = "Apache-2.0"
requires-python = "==3.13.*"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
]

[project.scripts]
technitium-dhcp-sync = "technitium_dhcp_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py313"
line-length = 100
preview = true
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Each pair below conflicts; the rule kept is named in the comment.
    "incorrect-blank-line-before-class", # keep blank-line-before-class
    "multi-line-summary-second-line",    # keep multi-line-summary-first-line
    "missing-trailing-comma",            # conflicts with the formatter
    "missing-copyright-notice",          # LICENSE covers the repo
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "assert",                       # pytest uses assert
    "magic-value-comparison",       # literal values are the point of a test
    "import-private-name",          # tests may import private names
    "undocumented-public-function", # test names state the behavior under test
    # Test helpers get one-line docstrings; full Returns/Raises/Yields sections add noise.
    "docstring-missing-returns",
    "docstring-missing-exception",
    "docstring-missing-yields",
]
"tests/integration/**" = [
    "suspicious-subprocess-import",         # the tests drive docker compose
    "subprocess-without-shell-equals-true", # docker compose runs with fixed arguments
    "start-process-with-partial-path",      # docker is resolved from PATH
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool", "possibly-undefined"]
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m",
    "not integration",
    "--cov",
    "--cov-report=term-missing",
]
markers = ["integration: needs the docker compose test environment"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["technitium_dhcp_sync"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:"]
